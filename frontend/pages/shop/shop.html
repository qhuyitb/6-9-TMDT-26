{% extends 'pages/login/base.html' %}
{% load static %}

{% block title %}Cửa hàng - TechShop{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'login.css' %}">
<style>
    .shop-shell {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
    }

    .shop-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
    }

    .shop-title {
        font-size: 1.55rem;
        font-weight: 800;
        color: var(--text-dark);
    }

    .cart-summary {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-mid);
        font-weight: 600;
    }

    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 18px;
    }

    .shop-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 100%;
    }

    .shop-thumb {
        aspect-ratio: 4 / 3;
        background: #eef0f5;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-light);
        font-size: 2rem;
        position: relative;
    }

    .shop-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .wishlist-btn {
        width: 38px;
        height: 38px;
        border: 1px solid rgba(229, 57, 53, .18);
        border-radius: 50%;
        background: rgba(255, 255, 255, .92);
        color: var(--primary);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 10px;
        right: 10px;
        transition: background var(--transition), color var(--transition), transform var(--transition);
        box-shadow: var(--shadow-sm);
    }

    .wishlist-btn:hover {
        transform: translateY(-1px);
        background: var(--white);
    }

    .wishlist-btn.active {
        background: var(--primary);
        color: var(--white);
    }

    .wishlist-btn:disabled {
        cursor: wait;
        opacity: .72;
        transform: none;
    }

    .shop-card-body {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
    }

    .product-name {
        font-size: .98rem;
        font-weight: 700;
        line-height: 1.35;
        color: var(--text-dark);
    }

    .product-meta {
        font-size: .82rem;
        color: var(--text-light);
    }

    .product-price {
        margin-top: auto;
        color: var(--primary);
        font-size: 1.05rem;
        font-weight: 800;
    }

    .add-cart-btn {
        border: none;
        border-radius: var(--radius);
        padding: 11px 12px;
        background: var(--primary);
        color: var(--white);
        font-weight: 700;
        cursor: pointer;
        transition: background var(--transition), transform var(--transition);
    }

    .add-cart-btn:hover {
        background: var(--primary-dark);
        transform: translateY(-1px);
    }

    .add-cart-btn:disabled {
        background: var(--text-light);
        cursor: not-allowed;
        transform: none;
    }

    .shop-message {
        grid-column: 1 / -1;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        text-align: center;
        color: var(--text-mid);
    }

    @media (max-width: 640px) {
        .shop-toolbar {
            align-items: flex-start;
            flex-direction: column;
        }
    }
</style>
{% endblock %}

{% block content %}
<section class="shop-shell">
    <div class="shop-toolbar">
        <h1 class="shop-title">Sản phẩm</h1>
        <div class="cart-summary">
            <span>Giỏ hàng:</span>
            <strong id="cartTotal">0 sản phẩm</strong>
        </div>
    </div>

    <div id="productGrid" class="product-grid">
        <div class="shop-message">Đang tải sản phẩm...</div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    const SHOP_API_BASE = 'http://127.0.0.1:8000/api';
    let wishlistProductIds = new Set();

    document.addEventListener('DOMContentLoaded', async () => {
        syncHeaderSearch();
        await loadWishlistSummary();
        loadShopProducts();
        loadCartSummary();
    });

    function getSearchQuery() {
        return new URLSearchParams(window.location.search).get('search')?.trim() || '';
    }

    function syncHeaderSearch() {
        const searchInput = document.querySelector('.search-bar input');
        const searchQuery = getSearchQuery();

        if (searchInput && searchQuery) {
            searchInput.value = searchQuery;
        }
    }

    async function loadShopProducts() {
        const grid = document.getElementById('productGrid');
        const searchQuery = getSearchQuery();
        const params = new URLSearchParams({ status: 'active' });

        if (searchQuery) {
            params.set('search', searchQuery);
        }

        try {
            const res = await fetch(`${SHOP_API_BASE}/products/?${params.toString()}`);
            if (!res.ok) throw new Error('Cannot load products');

            const data = await res.json();
            const products = data.results || data;

            if (!products.length) {
                grid.innerHTML = searchQuery
                    ? `<div class="shop-message">Không tìm thấy sản phẩm phù hợp với "${escapeHtml(searchQuery)}".</div>`
                    : '<div class="shop-message">Chưa có sản phẩm đang bán.</div>';
                return;
            }

            renderProducts(products);
        } catch (error) {
            grid.innerHTML = '<div class="shop-message">Không thể tải sản phẩm.</div>';
        }
    }

    function renderProducts(products) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = products.map(product => renderProductCard(product)).join('');
    }

    function renderProductCard(product) {
        const image = product.images && product.images.length
            ? `<img src="${product.images[0].image_url}" alt="${escapeHtml(product.name)}">`
            : '<span>Image</span>';
        const disabled = product.stock_quantity <= 0 ? 'disabled' : '';
        const buttonText = product.stock_quantity <= 0 ? 'Hết hàng' : 'Thêm vào giỏ';

        return `
            <article class="shop-card">
                <div class="shop-thumb">
                    ${image}
                    <button class="wishlist-btn ${wishlistProductIds.has(product.id) ? 'active' : ''}"
                        type="button"
                        title="${wishlistProductIds.has(product.id) ? 'Bỏ yêu thích' : 'Thêm vào yêu thích'}"
                        aria-label="${wishlistProductIds.has(product.id) ? 'Bỏ yêu thích' : 'Thêm vào yêu thích'}"
                        aria-pressed="${wishlistProductIds.has(product.id)}"
                        onclick="toggleWishlist(event, ${product.id})">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="${wishlistProductIds.has(product.id) ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    </button>
                </div>
                <div class="shop-card-body">
                    <div class="product-name">${escapeHtml(product.name)}</div>
                    <div class="product-meta">${escapeHtml(product.brand)} - Còn ${product.stock_quantity}</div>
                    <div class="product-price">${formatPrice(product.price)}</div>
                    <button class="add-cart-btn" ${disabled} onclick="addToCart(${product.id})">
                        ${buttonText}
                    </button>
                </div>
            </article>
        `;
    }

    async function loadWishlistSummary() {
        try {
            const res = await fetch(`${SHOP_API_BASE}/auth/wishlist/`, {
                headers: getCustomerHeaders()
            });
            if (!res.ok) {
                wishlistProductIds = new Set();
                return;
            }

            const data = await res.json();
            syncWishlistState(data.items || []);
        } catch (error) {
            wishlistProductIds = new Set();
        }
    }

    async function toggleWishlist(event, productId) {
        event.preventDefault();
        event.stopPropagation();

        const button = event.currentTarget;
        const isFavorite = wishlistProductIds.has(productId);
        button.disabled = true;

        try {
            const res = await fetch(`${SHOP_API_BASE}/auth/wishlist/items/${isFavorite ? productId + '/' : ''}`, {
                method: isFavorite ? 'DELETE' : 'POST',
                headers: getCustomerHeaders(true),
                body: isFavorite ? undefined : JSON.stringify({ product_id: productId })
            });
            const data = await res.json().catch(() => ({}));

            if (!res.ok) {
                alert(data.error || 'Không thể cập nhật danh sách yêu thích.');
                return;
            }

            if (Array.isArray(data.items)) {
                syncWishlistState(data.items);
            } else if (isFavorite) {
                wishlistProductIds.delete(productId);
            } else {
                wishlistProductIds.add(productId);
            }

            updateWishlistButtons();
        } catch (error) {
            alert('Không thể kết nối backend.');
        } finally {
            button.disabled = false;
        }
    }

    function syncWishlistState(items) {
        wishlistProductIds = new Set(items.map(item => Number(item.product_id)));
    }

    function updateWishlistButtons() {
        document.querySelectorAll('.wishlist-btn').forEach(button => {
            const match = button.getAttribute('onclick')?.match(/toggleWishlist\(event,\s*(\d+)\)/);
            if (!match) return;

            const productId = Number(match[1]);
            const isFavorite = wishlistProductIds.has(productId);
            button.classList.toggle('active', isFavorite);
            button.setAttribute('aria-pressed', String(isFavorite));
            button.setAttribute('title', isFavorite ? 'Bỏ yêu thích' : 'Thêm vào yêu thích');
            button.setAttribute('aria-label', isFavorite ? 'Bỏ yêu thích' : 'Thêm vào yêu thích');
            const icon = button.querySelector('svg');
            if (icon) icon.setAttribute('fill', isFavorite ? 'currentColor' : 'none');
        });
    }

    async function addToCart(productId) {
        try {
            const res = await fetch(`${SHOP_API_BASE}/auth/cart/items/`, {
                method: 'POST',
                headers: getCustomerHeaders(true),
                body: JSON.stringify({ product_id: productId, quantity: 1 })
            });
            const data = await res.json();

            if (!res.ok) {
                alert(data.error || 'Không thể thêm sản phẩm vào giỏ hàng.');
                return;
            }

            updateCartUi(data.total_quantity || 0);
        } catch (error) {
            alert('Không thể kết nối backend.');
        }
    }

    async function loadCartSummary() {
        try {
            const res = await fetch(`${SHOP_API_BASE}/auth/cart/`, {
                headers: getCustomerHeaders()
            });
            if (!res.ok) {
                updateCartUi(0);
                return;
            }
            const data = await res.json();
            updateCartUi(data.total_quantity || 0);
        } catch (error) {
            updateCartUi(0);
        }
    }

    function updateCartUi(totalQuantity) {
        const cartTotal = document.getElementById('cartTotal');
        const badge = document.querySelector('.header-actions .badge');

        if (cartTotal) {
            cartTotal.textContent = `${totalQuantity} sản phẩm`;
        }

        if (badge) {
            badge.textContent = totalQuantity;
        }
    }

    function getAccessToken() {
        return localStorage.getItem('access_token') || '';
    }

    function getCustomerHeaders(includeJson = false) {
        const headers = {};
        if (includeJson) headers['Content-Type'] = 'application/json';

        const token = getAccessToken();
        if (token) {
            headers['Authorization'] = `Bearer ${token}`;
        } else {
            headers['X-Guest-Session'] = getGuestSessionId();
        }
        return headers;
    }

    function getGuestSessionId() {
        let sessionId = localStorage.getItem('guest_session_id');
        if (!sessionId) {
            const randomPart = crypto.randomUUID
                ? crypto.randomUUID().replace(/-/g, '')
                : `${Date.now()}${Math.random().toString(16).slice(2)}`;
            sessionId = `guest_${randomPart}`;
            localStorage.setItem('guest_session_id', sessionId);
        }
        return sessionId;
    }

    function formatPrice(price) {
        const value = Number(price);
        if (!Number.isFinite(value)) return '0 ₫';
        return new Intl.NumberFormat('vi-VN', {
            style: 'currency',
            currency: 'VND'
        }).format(value);
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }
</script>
{% endblock %}
