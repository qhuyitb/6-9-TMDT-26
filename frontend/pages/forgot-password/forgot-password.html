{% extends 'pages/login/base.html' %}
{% load static %}

{% block title %}Quên mật khẩu - TechShop{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'login.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="tab-panel active">
      <p class="auth-subtitle">Nhập email tài khoản để nhận liên kết đặt lại mật khẩu</p>

      <form id="forgotPasswordForm" class="auth-form">
        <div class="form-group">
          <label for="forgot-email">Email</label>
          <input
            type="email"
            id="forgot-email"
            name="email"
            placeholder="example@email.com"
            required
          />
        </div>

        <div id="forgotPasswordMessage" class="auth-message" hidden></div>

        <button type="submit" class="btn-primary">GỬI LIÊN KẾT</button>
        <a href="/login/" class="link-muted auth-back-link">Quay lại đăng nhập</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
