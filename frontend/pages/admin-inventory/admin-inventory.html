<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hàng tồn kho</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-w: 230px;
    --primary: #1a56db;
    --accent: #f59e0b;
    --bg: #f1f5f9;
    --sidebar-bg: #0f172a;
    --sidebar-text: #94a3b8;
    --text-main: #1e293b;
    --text-sub: #64748b;
    --border: #e2e8f0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Be Vietnam Pro', sans-serif; background: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }

  .sidebar { width: var(--sidebar-w); background: var(--sidebar-bg); min-height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; z-index: 100; }
  .sidebar-logo { padding: 20px 20px 16px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 10px; }
  .sidebar-logo .logo-icon { width: 36px; height: 36px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; }
  .sidebar-logo span { color: white; font-weight: 700; font-size: 15px; line-height: 1.2; }
  .sidebar-logo small { color: var(--sidebar-text); font-size: 11px; display: block; font-weight: 400; }
  .sidebar-nav { padding: 12px 0; flex: 1; }
  .nav-section-label { color: #475569; font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; padding: 10px 20px 4px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; color: var(--sidebar-text); text-decoration: none; font-size: 13.5px; font-weight: 500; transition: all 0.15s; cursor: pointer; border: none; background: none; width: 100%; }
  .nav-item:hover { color: white; background: #1e293b; }
  .nav-item.active { color: white; background: var(--primary); position: relative; }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); border-radius: 0 2px 2px 0; }
  .nav-item i { font-size: 16px; width: 20px; text-align: center; }

  .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { background: white; border-bottom: 1px solid var(--border); padding: 0 28px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
  .topbar-left { display: flex; align-items: center; gap: 8px; color: var(--text-sub); font-size: 13.5px; }
  .topbar-left strong { color: var(--text-main); font-size: 15px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .topbar-icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: white; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-sub); font-size: 16px; position: relative; transition: all 0.15s; }
  .topbar-icon-btn:hover { background: var(--bg); }
  .badge-dot { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; background: #ef4444; border-radius: 50%; border: 1.5px solid white; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: white; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  .page-content { padding: 28px; flex: 1; }
  .page-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .page-subtitle { font-size: 13px; color: var(--text-sub); }
  .info-card { margin-top: 18px; background: white; border: 1px solid var(--border); border-radius: 12px; padding: 16px; color: var(--text-sub); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon"><i class="bi bi-cpu"></i></div>
    <div><span>TechShop</span><small>Admin Panel</small></div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">Tổng quan</div>
    <a class="nav-item" href="/admin-home/"><i class="bi bi-grid-1x2"></i> Trang chủ</a>
    <div class="nav-section-label">Quản lý</div>
    <a class="nav-item" href="/admin-customers/"><i class="bi bi-people"></i> Khách hàng</a>
    <a class="nav-item" href="/admin-orders/"><i class="bi bi-bag"></i> Đơn hàng</a>
    <a class="nav-item" href="/admin-products/"><i class="bi bi-box-seam"></i> Sản phẩm</a>
    <a class="nav-item" href="/admin-categories/"><i class="bi bi-tags"></i> Loại sản phẩm</a>
    <a class="nav-item" href="/admin-reviews/"><i class="bi bi-star"></i> Đánh giá KH</a>
    <div class="nav-section-label">Thống kê</div>
    <a class="nav-item" href="/admin-top-categories/"><i class="bi bi-fire"></i> Danh mục bán chạy</a>
    <a class="nav-item" href="/admin-top-products/"><i class="bi bi-trophy"></i> Sản phẩm bán chạy</a>
    <a class="nav-item active" href="/admin-inventory/"><i class="bi bi-archive"></i> Hàng tồn kho</a>
  </nav>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <span>Thống kê</span>
      <i class="bi bi-chevron-right" style="font-size:11px"></i>
      <strong>Hàng tồn kho</strong>
    </div>
    <div class="topbar-right">
      <div class="topbar-icon-btn"><i class="bi bi-bell"></i><span class="badge-dot"></span></div>
      <div class="avatar">AD</div>
    </div>
  </div>

  <div class="page-content">
    <div class="page-title">Hàng tồn kho</div>
    <div class="page-subtitle">Dữ liệu sẽ lấy từ API /api/admin/inventory/.</div>
    <div class="info-card">Trang đang chờ giao diện thống kê tồn kho.</div>
  </div>
</div>

<script>
  (function requireAdmin() {
    const role = localStorage.getItem('user_role');
    const token = localStorage.getItem('access_token');
    if (!token || role !== 'admin') {
      window.location.href = '/admin-login/';
    }
  })();
</script>
</body>
</html>
