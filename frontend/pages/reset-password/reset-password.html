{% extends 'pages/login/base.html' %}
{% load static %}

{% block title %}Đặt lại mật khẩu - TechShop{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'login.css' %}">
{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="tab-panel active">
      <p class="auth-subtitle">Tạo mật khẩu mới cho tài khoản của bạn</p>

      <form id="resetPasswordForm" class="auth-form">
        <div class="form-group">
          <label for="reset-password">Mật khẩu mới</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="reset-password"
              name="password"
              placeholder="Ít nhất 8 ký tự và 1 chữ in hoa"
              required
            />
            <button type="button" class="toggle-pw" data-target="reset-password">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="reset-password-confirm">Xác nhận mật khẩu</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="reset-password-confirm"
              name="password_confirm"
              placeholder="Nhập lại mật khẩu mới"
              required
            />
            <button type="button" class="toggle-pw" data-target="reset-password-confirm">
              <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <div id="resetPasswordMessage" class="auth-message" hidden></div>

        <button type="submit" class="btn-primary">ĐẶT LẠI MẬT KHẨU</button>
        <a href="/login/" class="link-muted auth-back-link">Quay lại đăng nhập</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
