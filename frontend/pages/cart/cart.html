{% extends 'pages/login/base.html' %}
{% load static %}

{% block title %}Giỏ hàng - TechShop{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'login.css' %}">
<style>
    .cart-shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 24px;
    }

    .cart-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
    }

    .cart-title {
        font-size: 1.55rem;
        font-weight: 800;
        color: var(--text-dark);
    }

    .cart-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 20px;
        align-items: start;
    }

    .cart-list,
    .cart-summary-box,
    .empty-cart {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
    }

    .cart-list {
        overflow: hidden;
    }

    .cart-item {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr) 130px 120px 44px;
        gap: 14px;
        align-items: center;
        padding: 16px;
        border-bottom: 1px solid var(--border);
    }

    .cart-item:last-child {
        border-bottom: none;
    }

    .cart-thumb {
        width: 88px;
        aspect-ratio: 1;
        border-radius: var(--radius);
        background: #eef0f5;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-light);
        overflow: hidden;
        font-size: .82rem;
    }

    .cart-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .cart-name {
        font-weight: 700;
        color: var(--text-dark);
        line-height: 1.35;
    }

    .cart-price {
        margin-top: 4px;
        color: var(--primary);
        font-weight: 700;
    }

    .qty-control {
        display: inline-grid;
        grid-template-columns: 34px 42px 34px;
        height: 34px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--white);
    }

    .qty-control button {
        border: none;
        background: var(--bg);
        cursor: pointer;
        font-weight: 800;
        color: var(--text-mid);
    }

    .qty-control span {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
    }

    .line-total {
        text-align: right;
        font-weight: 800;
        color: var(--text-dark);
    }

    .remove-btn {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--white);
        color: var(--primary);
        cursor: pointer;
        font-size: 1.1rem;
    }

    .cart-summary-box {
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        position: sticky;
        top: 92px;
    }

    .summary-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--text-mid);
    }

    .summary-row.total {
        padding-top: 14px;
        border-top: 1px solid var(--border);
        color: var(--text-dark);
        font-size: 1.1rem;
        font-weight: 800;
    }

    .payment-methods {
        padding-top: 14px;
        border-top: 1px solid var(--border);
        display: grid;
        gap: 10px;
    }

    .payment-title {
        font-weight: 800;
        color: var(--text-dark);
    }

    .payment-option {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        background: var(--white);
    }

    .payment-option:has(input:checked) {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(229, 57, 53, .10);
    }

    .payment-option input {
        margin-top: 3px;
        accent-color: var(--primary);
    }

    .payment-name {
        display: block;
        font-weight: 800;
        color: var(--text-dark);
    }

    .payment-desc {
        display: block;
        margin-top: 3px;
        color: var(--text-light);
        font-size: .88rem;
        line-height: 1.35;
    }

    .checkout-btn,
    .continue-btn {
        border-radius: var(--radius);
        padding: 12px 14px;
        text-align: center;
        font-weight: 800;
        cursor: pointer;
    }

    .checkout-btn {
        border: none;
        background: var(--primary);
        color: var(--white);
    }

    .continue-btn {
        border: 1px solid var(--border);
        background: var(--white);
        color: var(--text-dark);
        display: inline-block;
    }

    .empty-cart {
        padding: 34px 24px;
        text-align: center;
        color: var(--text-mid);
    }

    .empty-cart p {
        margin-bottom: 16px;
    }

    @media (max-width: 860px) {
        .cart-layout {
            grid-template-columns: 1fr;
        }

        .cart-item {
            grid-template-columns: 74px minmax(0, 1fr) 44px;
        }

        .cart-thumb {
            width: 74px;
        }

        .qty-control,
        .line-total {
            grid-column: 2 / 4;
        }

        .line-total {
            text-align: left;
        }
    }
</style>
{% endblock %}

{% block content %}
<section class="cart-shell">
    <div class="cart-header">
        <h1 class="cart-title">Giỏ hàng</h1>
    </div>

    <div id="cartContent">
        <div class="empty-cart">Đang tải giỏ hàng...</div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
    const CART_API_BASE = 'http://127.0.0.1:8000/api';

    document.addEventListener('DOMContentLoaded', () => {
        loadCart();
    });

    async function loadCart() {
        const token = getAccessToken();
        if (!token) {
            renderLoginRequired();
            updateHeaderBadge(0);
            return;
        }

        try {
            const res = await fetch(`${CART_API_BASE}/auth/cart/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 401) {
                renderLoginRequired();
                updateHeaderBadge(0);
                return;
            }

            if (!res.ok) throw new Error('Cannot load cart');

            const cart = await res.json();
            renderCart(cart);
            updateHeaderBadge(cart.total_quantity || 0);
        } catch (error) {
            document.getElementById('cartContent').innerHTML =
                '<div class="empty-cart">Không thể tải giỏ hàng.</div>';
        }
    }

    function renderCart(cart) {
        const container = document.getElementById('cartContent');
        const items = cart.items || [];

        if (!items.length) {
            container.innerHTML = `
                <div class="empty-cart">
                    <p>Giỏ hàng đang trống.</p>
                    <a class="continue-btn" href="/shop/">Tiếp tục mua hàng</a>
                </div>
            `;
            return;
        }

        container.innerHTML = `
            <div class="cart-layout">
                <div class="cart-list">
                    ${items.map(item => renderCartItem(item)).join('')}
                </div>
                <aside class="cart-summary-box">
                    <div class="summary-row">
                        <span>Số lượng</span>
                        <strong>${cart.total_quantity || 0} sản phẩm</strong>
                    </div>
                    <div class="summary-row">
                        <span>Tạm tính</span>
                        <strong>${formatPrice(cart.total_price || 0)}</strong>
                    </div>
                    <div class="summary-row total">
                        <span>Tổng cộng</span>
                        <strong>${formatPrice(cart.total_price || 0)}</strong>
                    </div>
                    <div class="payment-methods" role="radiogroup" aria-label="Phương thức thanh toán">
                        <div class="payment-title">Phương thức thanh toán</div>
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="cod" checked>
                            <span>
                                <span class="payment-name">Thanh toán khi nhận hàng</span>
                                <span class="payment-desc">Đặt hàng trước, thanh toán tiền mặt khi đơn được giao.</span>
                            </span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="vnpay">
                            <span>
                                <span class="payment-name">Thanh toán qua VNPay</span>
                                <span class="payment-desc">Chuyển sang cổng VNPay để thanh toán online.</span>
                            </span>
                        </label>
                    </div>
                    <button class="checkout-btn" type="button" onclick="checkoutCart(this)">Thanh toán</button>
                    <a class="continue-btn" href="/shop/">Tiếp tục mua hàng</a>
                </aside>
            </div>
        `;
    }

    function renderCartItem(item) {
        const image = item.image
            ? `<img src="${item.image}" alt="${escapeHtml(item.product_name)}">`
            : '<span>Image</span>';

        return `
            <article class="cart-item">
                <div class="cart-thumb">${image}</div>
                <div>
                    <div class="cart-name">${escapeHtml(item.product_name)}</div>
                    <div class="cart-price">${formatPrice(item.unit_price)}</div>
                </div>
                <div class="qty-control">
                    <button type="button" onclick="changeQuantity(${item.id}, ${item.quantity - 1})">-</button>
                    <span>${item.quantity}</span>
                    <button type="button" onclick="changeQuantity(${item.id}, ${item.quantity + 1})">+</button>
                </div>
                <div class="line-total">${formatPrice(item.line_total)}</div>
                <button class="remove-btn" type="button" title="Xoa" onclick="removeCartItem(${item.id})">&times;</button>
            </article>
        `;
    }

    async function changeQuantity(itemId, quantity) {
        const token = getAccessToken();
        if (!token) return renderLoginRequired();

        try {
            const res = await fetch(`${CART_API_BASE}/auth/cart/items/${itemId}/`, {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ quantity })
            });
            const cart = await res.json();

            if (!res.ok) {
                alert(cart.error || 'Không thể cập nhật giỏ hàng.');
                return;
            }

            renderCart(cart);
            updateHeaderBadge(cart.total_quantity || 0);
        } catch (error) {
            alert('Không thể kết nối backend.');
        }
    }

    async function removeCartItem(itemId) {
        const token = getAccessToken();
        if (!token) return renderLoginRequired();

        try {
            const res = await fetch(`${CART_API_BASE}/auth/cart/items/${itemId}/delete/`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const cart = await res.json();

            if (!res.ok) {
                alert(cart.error || 'Không thể xóa sản phẩm.');
                return;
            }

            renderCart(cart);
            updateHeaderBadge(cart.total_quantity || 0);
        } catch (error) {
            alert('Không thể kết nối backend.');
        }
    }

    async function checkoutCart(button) {
        const token = getAccessToken();
        if (!token) return renderLoginRequired();

        const oldText = button.textContent;
        button.disabled = true;
        button.textContent = 'Đang xử lý...';

        try {
            const paymentMethod = getSelectedPaymentMethod();
            const address = await getCheckoutAddress(token);
            const payload = {
                payment_method: paymentMethod,
                shipping_method: 'standard',
                shipping_fee: 0,
                note: ''
            };
            if (address) {
                payload.address_id = address.id;
            }

            const res = await fetch(`${CART_API_BASE}/orders/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (!res.ok) {
                alert(data.error || data.detail || 'Không thể tạo đơn hàng.');
                return;
            }

            updateHeaderBadge(0);
            if (paymentMethod === 'vnpay' && data.payment_url) {
                window.location.href = data.payment_url;
                return;
            }

            window.location.href = `/orders/?created=${encodeURIComponent(data.id)}`;
        } catch (error) {
            alert('Không thể kết nối backend.');
        } finally {
            button.disabled = false;
            button.textContent = oldText;
        }
    }

    function getSelectedPaymentMethod() {
        return document.querySelector('input[name="paymentMethod"]:checked')?.value || 'cod';
    }

    async function getCheckoutAddress(token) {
        const res = await fetch(`${CART_API_BASE}/auth/addresses/`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error('Cannot load addresses');

        const addresses = await res.json();
        if (addresses.length) {
            return addresses.find(item => item.is_default) || addresses[0];
        }

        return null;
    }

    function renderLoginRequired() {
        document.getElementById('cartContent').innerHTML = `
            <div class="empty-cart">
                <p>Bạn cần đăng nhập để xem giỏ hàng.</p>
                <a class="continue-btn" href="/login/">Đăng nhập</a>
            </div>
        `;
    }

    function updateHeaderBadge(totalQuantity) {
        const badge = document.querySelector('.header-actions .badge');
        if (badge) {
            badge.textContent = totalQuantity;
        }
    }

    function getAccessToken() {
        return localStorage.getItem('access_token') || '';
    }

    function formatPrice(price) {
        const value = Number(price);
        if (!Number.isFinite(value)) return '0 ₫';
        return new Intl.NumberFormat('vi-VN', {
            style: 'currency',
            currency: 'VND'
        }).format(value);
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }
</script>
{% endblock %}
